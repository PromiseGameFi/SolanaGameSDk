[package]
name = "wallet"
version = "0.1.0"
edition = "2024"

[dependencies]
# Cryptographic dependencies
secp256k1 = { version = "0.27", features = ["rand"] }
rand = "0.8"
sha2 = "0.10"
aes-gcm = "0.10"
# Ethereum interaction
ethers = { version = "2.0", features = ["rustls"] }
tokio = { version = "1.28", features = ["full"] }
rlp = "0.5.2"   
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async runtime
async-trait = "0.1"

# Environment variables
dotenv = "0.15"

# CLI dependencies
clap = { version = "4.0", features = ["derive"] }
hex = "0.4"

# MPC TSS dependencies
frost-secp256k1 = "0.7.0"
vsss-rs = "3.2.1"


