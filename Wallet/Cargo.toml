[package]
name = "mpc-tss-wallet"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "MPC-TSS Wallet for Sepolia Ethereum"

[dependencies]
# Use ethers without rustls (which pulls in ring)
ethers = { version = "2.0", default-features = false, features = ["ws"] }
curv-kzen = "0.9.0"
multi-party-ecdsa = "0.8.1"
paillier = "0.2.0"
round-based = "0.2.0"
zk-paillier = "0.4.3"
aes-gcm = "0.10.1"
sha2 = "0.10.6"
rand = "0.8.5"
hex = "0.4.3"

# CLI
clap = { version = "4.3.0", features = ["derive"] }
colored = "2.0.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utility
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
tokio = { version = "1.28", features = ["full"] }
