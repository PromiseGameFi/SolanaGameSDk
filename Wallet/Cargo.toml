[package]
name = "mpc_tss_wallet"
version = "0.1.0"
edition = "2021"

[dependencies]
multi-party-ecdsa = { version = "0.4", features = ["secp256k1"] }
ethers = { version = "2.0", features = ["rustls", "http", "ws"] }
secp256k1 = { version = "0.24", features = ["rand-std"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"
anyhow = "1.0"