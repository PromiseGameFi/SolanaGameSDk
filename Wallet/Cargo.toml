[package]
name = "mpc_tss_wallet"
version = "0.1.0"
edition = "2021"

[dependencies]
secp256k1 = { version = "0.24", features = ["bitcoin_hashes"] }
threshold_crypto = "0.4"
ethers = { version = "2.0", features = ["legacy"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
rand = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
anyhow = "1.0"