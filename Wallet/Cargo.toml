[package]
name = "mpc_tss_wallet"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
curv-kzen = { version = "0.9", features = ["rust-gmp-kzen"] }
secp256k1 = { version = "0.24", features = ["rand-std"] }
ethers = { version = "2.0", features = ["rustls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"
anyhow = "1.0"

[patch.crates-io]
signature = "=1.3.2"
ecdsa-core = "=0.12"
p256 = "=0.9"
