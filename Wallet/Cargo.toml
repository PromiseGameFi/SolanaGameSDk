[package]
name = "mpc_tss_wallet"
version = "0.1.0"
edition = "2021"

[dependencies]
curv-kzen = "0.10.0"
multi-party-ecdsa = "0.8.1"
round-based = "0.2.0"
k256 = { version = "0.12.0", features = ["ecdsa"] }
ethers = { version = "2.0.4", features = ["rustls"] }
rand = "0.8.5"
sha3 = "0.10.6"
rlp = "0.5.2"
hex = "0.4.3"
tokio = { version = "1.28.2", features = ["full"] }
anyhow = "1.0.71"
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"
thiserror = "1.0.40"