[package]
name = "wallet"
version = "0.1.0"
edition = "2021"

[dependencies]
# Ethereum and crypto dependencies
ethers = { version = "2.0", features = ["rustls", "legacy"] }
curv-kzen = "0.9"
multi-party-ecdsa = "0.8"
tiny-keccak = { version = "2.0", features = ["keccak"] }
secp256k1 = { version = "0.27", features = ["rand", "recovery"] }
rand = "0.8"
sha2 = "0.10"

# Serialization
serde = { version = "1.0.158", features = ["derive"] }
serde_json = "1.0.94"
hex = "0.4.3"

# Error handling
anyhow = "1.0.70"
thiserror = "1.0.40"

# CLI
clap = { version = "4.1", features = ["derive"] }

# Async runtime
tokio = { version = "1.27", features = ["full"] }

# Additional dependencies for signature verification
signature = "1.3.0"
ecdsa = "0.12.1"
p256 = "0.9.0"
