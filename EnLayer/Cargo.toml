[package]
name = "eth_mpc_threshold"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
dotenv = "0.15"
ethers = "2.0"
rand = "0.8"
sha2 = "0.10"
secp256k1 = { version = "0.27", features = ["rand"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "eth_mpc_threshold"
path = "src/main.rs"

[[bin]]
name = "generate_shares"
path = "src/bin/generate_shares.rs"

[[bin]]
name = "create_signature"
path = "src/bin/create_signature.rs"

[[bin]]
name = "send_transaction"
path = "src/bin/send_transaction.rs"