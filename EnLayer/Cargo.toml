[package]
name = "mpc_tss_wallet"
version = "0.1.0"
edition = "2021"

[dependencies]
# Cryptographic dependencies
secp256k1 = { version = "0.27", features = ["rand"] }
rand = "0.8"
sha2 = "0.10"
aes-gcm = "0.10"

# Ethereum interaction
ethers = { version = "2.0", features = ["rustls"] }
tokio = { version = "1.28", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async runtime
async-trait = "0.1"