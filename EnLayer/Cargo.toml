[package]
name = "eth_mpc_threshold"
version = "0.1.0"
edition = "2021"

[dependencies]
# Cryptographic primitives
curve25519-dalek = "4.1"
sha2 = "0.10"
rand = "0.8"
secp256k1 = "0.27"

# Ethereum interaction
ethers = "2.0"
tokio = { version = "1.28", features = ["full"] }

# Network communication
tonic = "0.9"
prost = "0.11"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"